# 每次 push / PR 跑 tools/ci.sh fast。runner 上没有资源包, 依赖它的测试与检查自动 SKIP 并在汇总里列出原因与数量。
name: ci
on:
  push:
  pull_request:

jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GODOT_CACHE_DIR: ${{ github.workspace }}/.cache/godot   # tools/ci_install_godot.sh 的下载缓存
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements-ci.txt
      - uses: actions/cache@v4
        with:
          path: .cache/godot
          key: godot-4.7.2-${{ hashFiles('tools/ci_install_godot.sh') }}
      - run: python3 -m pip install -r tools/requirements-ci.txt
      - run: tools/ci_install_godot.sh
      - run: tools/ci.sh fast
        env:
          CI_LOG_DIR: ${{ github.workspace }}/ci-logs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-logs
          path: ci-logs/
          retention-days: 7
