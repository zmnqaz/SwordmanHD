# 在 GitHub 的 macOS 机器上编译 iOS 版 (没有 Mac 时用): 产出一个未签名的 IPA, 下载后用 Sideloader / Sideloadly / AltStore 以自己的 Apple ID 签名装到 iPhone/iPad。
# 说明见 docs/打包/iOS.md。只含代码和手写内容, 不含任何原版资源 (资源包由玩家自己生成, 装机后拷进应用的文件夹)。
# 手动触发: GitHub 仓库 → Actions → "iOS (unsigned IPA)" → Run workflow。
name: iOS (unsigned IPA)

on:
  workflow_dispatch:
  workflow_call:          # 被 build.yml (三平台出包) 调用
  push:
    tags: ["ios-*"]

env:
  GODOT_VERSION: "4.7.2"
  XCODE_VERSION: "27.1"      # iPhone Duo (折叠屏) 的 SDK 从 27.1 起带; 要换版本只改这里

jobs:
  build:
    runs-on: xcode-27          # GitHub 的 Xcode 27 镜像 (preview, macOS 27, 装有 Xcode 27.0 / 27.1 / 27.2); 出问题可退回 macos-15 + Xcode 26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: 切到 Xcode ${{ env.XCODE_VERSION }} (Godot 4.7 的引擎库要 iOS 26 以上的 SDK; 太老的 Xcode 链接会缺 CADynamicRange*/MTLTensorDomain)
        run: |
          set -euo pipefail
          X="/Applications/Xcode_${XCODE_VERSION}.app"
          if [ ! -d "$X" ]; then echo "镜像里没有 $X, 已装的有:"; ls -d /Applications/Xcode*.app; exit 1; fi
          echo "用 $X"
          sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: 安装 Godot ${{ env.GODOT_VERSION }} 与导出模板
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL -o godot.zip "$BASE/Godot_v${GODOT_VERSION}-stable_macos.universal.zip"
          curl -fsSL -o templates.tpz "$BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q godot.zip -d godot_app
          mkdir -p tools/godot
          cp -R godot_app/Godot.app tools/godot/Godot.app
          ln -sf Godot.app/Contents/MacOS/Godot tools/godot/godot
          TD="$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$TD"
          unzip -q templates.tpz -d tpz
          cp -R tpz/templates/* "$TD/"
          tools/godot/godot --version

      - name: 生成 Xcode 工程并编译 (不签名)
        run: python3 tools/platform/build_ios.py --ipa

      - name: 上传未签名 IPA
        uses: actions/upload-artifact@v4
        with:
          name: SwordmanHD-unsigned-ipa
          path: dist/ios/SwordmanHD-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
